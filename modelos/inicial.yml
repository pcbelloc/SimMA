!PARAMETERS
arrivals:
  RECEPCAO: 2.0
queues:
  RECEPCAO:
    servers: 1
    capacity: 5
    minArrival: 8.0
    maxArrival: 12.0
    minService: 3.0
    maxService: 5.0
  REPARO:
    servers: 1
    capacity: 8
    minService: 10.0
    maxService: 18.0
  TESTES:
    servers: 1
    capacity: 5
    minService: 3.0
    maxService: 7.0
network:
  - {source: RECEPCAO, target: REPARO, probability: 0.8}
  - {source: RECEPCAO, target: TESTES, probability: 0.2}
  - {source: REPARO, target: TESTES, probability: 1.0}
  - {source: TESTES, target: REPARO, probability: 0.2}
# Os 80% restantes após TESTES saem com serviço concluído.
# Chegada a qualquer fila cheia sai como perda, sem bloqueio da origem.
rndnumbersPerSeed: 100000
seeds: [42]
